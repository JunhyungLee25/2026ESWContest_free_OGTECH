name: Repository tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install map dependencies
        run: python -m pip install -r OGTECH-frontend/MAP/requirements.txt
      - name: Backend tests
        working-directory: OGTECH-backend
        run: python -B -m unittest discover -s tests -v
      - name: Frontend tests
        working-directory: OGTECH-frontend
        run: python -B -m unittest discover -s tests -v
      - name: Map engine tests
        working-directory: OGTECH-frontend/MAP
        run: python -B -m unittest discover -s tests -v
      - name: STM32 to Jetson check
        working-directory: OGTECH-embedded
        run: python -B -m unittest discover -s tests -v
      - name: LLM harness tests
        working-directory: OGTECH-llm
        run: python -B -m unittest discover -s tests -v
      - name: Co-LLM tests
        working-directory: OGTECH-llm/Co-LLM
        run: python -B -m unittest discover -s tests -v
