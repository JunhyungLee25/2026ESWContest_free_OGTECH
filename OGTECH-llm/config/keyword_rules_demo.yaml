{
  "version": 1,
  "note": "시연 변형 발화 오버레이. 정본 keyword_rules.yaml이 llm_required를 낸 뒤에만 본다(DemoRouter). refuse·생명 규칙은 정본이 먼저 처리하므로 여기 두지 않는다. 각 패턴은 config/demo_script.json의 variants에서 정본이 놓친 발화 기준(2026-08-30 probe 17건).",
  "refuse_patterns": [],
  "confirmation": {
    "yes_patterns": [
      "^(그렇게|그럼|그래) ?(해|해 줘|해줘|하자|진행|진행해)( 줘|줘|주세요)?$"
    ],
    "no_patterns": []
  },
  "assistant_rules": [
    {
      "action": "repeat_response",
      "scenario_id": "gear",
      "patterns": [
        "^(다시 한 번|다시 한번|한 번만 더|한번 더|다시) ?(말해|들려|읽어|얘기해|알려)( 줘|줘|주세요)?$",
        "(방금|아까).*(다시|한 번 더|한번 더).*(말|들려|알려)"
      ]
    }
  ],
  "map_rules": [
    {
      "action": "find_nearest_water",
      "scenario_id": "water",
      "patterns": [
        "^(아 |아이고 )?(너무 |정말 |많이 |좀 )?(목마르다|목마른데|목말라|목말라요|목이 마르다|목이 마른데|목이 말라)[요]?$",
        "목이 (너무 |많이 |좀 )?(마르|마른|말라)",
        "물 (마실|뜰|있는|나오는|구할) (곳|데|장소|지점).*(어디|찾|있|안내|보여)",
        "(근처|주변|가까운|가까이|이 근방).*물.*(있어|있나|있는지|있을까|어디)",
        "물 (좀 )?(찾아|찾아 줘|찾아줘|찾고 싶|어디)"
      ],
      "exclude_patterns": [
        "(마셔|음용|마셔도|마실 수 있).*(돼|괜찮|안전|되나|될까)",
        "(계곡물|샘물|고인 물|이 물|이물|정수)"
      ]
    },
    {
      "action": "route_basecamp",
      "scenario_id": "route",
      "patterns": [
        "(캠프|텐트|야영지|베이스캠프)(로|까지|에)?.*(돌아가|돌아갈|복귀|가고 싶|갈래|갈게|가야)",
        "(캠프|야영지|베이스캠프).*(길|경로|방향)"
      ]
    },
    {
      "action": "night_off",
      "scenario_id": "gear",
      "patterns": [
        "(원래|주간|낮|평소) ?(화면|모드|색)(으로|로)?.*(돌려|바꿔|전환|해 줘|해줘|복원|돌아가)",
        "화면.*(원래|원상|복원|밝게)",
        "(야간|적색|빨간|나이트|밤) ?(모드|화면)?.*(끄|그만|중지|해제|종료|꺼)"
      ]
    },
    {
      "action": "night_on",
      "scenario_id": "gear",
      "patterns": [
        "(야간|적색|나이트|밤) ?(모드|화면)?(로|으로)?\\s*(바꿔|전환|실행|해 줘|해줘|틀어|켜|시작|활성|들어가|넣어|해 주세요)",
        "^(야간|밤|나이트) ?(모드|화면)$",
        "화면.*(빨갛|붉게|적색|빨간색|빨간).*(해|바꿔|전환|켜)",
        "(암순응|어두운 데|밤에 보는) ?(모드|화면)",
        "(야간|밤|나이트) ?(모드|화면).*(설정|세팅)"
      ],
      "exclude_patterns": [
        "(끄|그만|중지|해제|종료|꺼|주간|원래|낮)"
      ]
    },
    {
      "action": "status",
      "scenario_id": "daylight",
      "patterns": [
        "(어두워|해 ?지|일몰|해가 ?지).*(얼마나|언제|남|몇 시|시간)",
        "얼마나.*(어두워|해 ?지|일몰|해가 ?지)",
        "해 (언제|몇 시에) (져|지는지|지나|떨어)",
        "(일몰|해 ?지는) (시각|시간)"
      ]
    }
  ],
  "scenario_rules": [
    {
      "scenario_id": "sleep_safety",
      "patterns": [
        "(텐트|차 안|쉘터|실내|텐트 안|차량).*(버너|가스|불|난로|화로|스토브).*(써도|쓰도|쓸까|써|사용|피우|피워|켜|켤|틀어)",
        "(버너|가스|난로|화로|스토브).*(텐트|차 안|쉘터|실내|차량).*(써도|쓰도|쓸까|써|사용|피우|켜|괜찮)"
      ]
    }
  ]
}
